  <rect x="460" y="270" width="250" height="14" rx="7" fill="url(#line)" opacity=".9"/>
  <rect x="460" y="318" width="535" height="12" rx="6" fill="#ffffff" opacity=".18"/>
  <rect x="460" y="356" width="455" height="12" rx="6" fill="#ffffff" opacity=".15"/>
